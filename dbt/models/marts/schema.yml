version: 2

models:
  - name: dim_customers
    description: One row per Superstore customer.
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_products
    description: One row per Superstore product.
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_id
        tests: [unique, not_null]
      - name: product_name
        tests: [not_null]

  - name: dim_date
    description: Calendar dates used by order and ship events.
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]

  - name: dim_ship_mode
    description: One row per shipping method.
    columns:
      - name: ship_mode_key
        tests: [unique, not_null]
      - name: ship_mode
        tests: [unique, not_null]

  - name: fact_sales
    description: One row per Superstore order line.
    columns:
      - name: row_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: order_date_key
        tests: [not_null]
      - name: ship_date_key
        tests: [not_null]
      - name: customer_key
        tests: [not_null]
      - name: product_key
        tests: [not_null]
      - name: ship_mode_key
        tests: [not_null]
